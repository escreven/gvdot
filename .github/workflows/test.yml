#
# See .github/workflows/README.md.
#

name: Integration Test

on:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  OLDEST_DEPS: 'ipython==7.23.1 notebook==5.7.0 pillow coverage'
  LATEST_DEPS: 'ipython notebook pillow coverage'

jobs:

  canary:
    name: Canary [ubuntu-latest, 3.12]
    strategy:
      matrix:
        python-version: ['3.12']
        dependencies: [ 'oldest', 'latest' ]
      fail-fast: false
    runs-on: ubuntu-latest

    steps: &test-steps
    - name: Checkout gvdot
      uses: actions/checkout@v5

    - name: Install Graphviz
      uses: $/.github/actions/install-graphviz

    - name: Prepare Pip Cache Key
      run: |
        date -u +'%G-%V' > .pip-cache-key
        echo "${{ matrix.dependencies }}" >> .pip-cache-key

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: 'pip'
        cache-dependency-path: .pip-cache-key

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip wheel setuptools
        if [ "${{ matrix.dependencies }}" = "oldest" ]; then
          python -m pip install $OLDEST_DEPS
        else
          python -m pip install $LATEST_DEPS
        fi
        python -m pip install -e .

    - name: Run Tests
      run: |
        dot -V
        coverage run --branch \
            --include 'src/gvdot.py' test/main.py -failstop
        coverage report --include=src/gvdot.py --fail-under=100

  full:
    name: Full
    needs: canary
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12', '3.13', '3.14', '3.15']
        dependencies: [ 'oldest', 'latest' ]
        exclude:
          - os: ubuntu-latest
            python-version: '3.12'
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps: *test-steps
